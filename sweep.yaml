# sweep.yaml
program: train_sweep.py # The script to run
method: random
metric:
  name: val/recon_loss
  goal: minimize
early_terminate:
  type: hyperband
  min_iter: 400
  eta: 2
parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 5.0e-6
    max: 8.0e-2
  adams_beta1:
    distribution: log_uniform_values
    min: 0.8
    max: 0.9
  adams_epsilon:
    distribution: log_uniform_values
    min: 5.0e-9
    max: 1.0e-7
  kld_warmup:
    distribution: log_uniform_values
    min: 500
    max: 4000
  num_inner_layers:
    value: 1
  hidden_dims_scale:
    value: 8
  var_coeff:
    value: 0.8525204745756596
  inv_coeff:
    value: 1.0
  cov_coeff:
    value: 0.04 # 1/25  
  loss:
    value: "pseudo-huber"
  projector_dims:
    values: [2, 4, 8, 16, 32, 64, 128]
  scheduler:
    value: "none"
  augment:
    value: True
  arch:
    value: "vae"

# --- Static parameters can be defined here too ---
# --- These will be included in wandb.config for every run ---
  max_steps:
    value: 5001
  load_frac:
    value: 1.0 # Use 0.01 for quick test runs
  checkpoint_every:
    value: 400
  val_every:
    value: 100
  batch_size:
    value: 32
  data_dir:
    value: "/scratch/users/nshaheed/musdb18"

# command:
#   - ${env}
#   - uv          # <-- Split into its own item
#   - run         # <-- Split into its own item
#   - ${program}  # <-- The program name is the third item
#   - --data-dir
#   - /scratch/users/nshaheed/musdb18
