# sweep.yaml
program: train_sweep.py # The script to run
method: bayes
metric:
  name: val/recon_loss
  goal: minimize
early_terminate:
  type: hyperband
  min_iter: 400
  eta: 2
parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 0.01
  adams_beta1:
    distribution: log_uniform_values
    min: 0.8
    max: 0.95
  adams_epsilon:
    distribution: log_uniform_values
    min: 1.0e-9
    max: 1.0e-7
  num_inner_layers:
    values: [1, 2]
  hidden_dims_scale:
    values: [4, 8]
  var_coeff:
    value: 0.8525204745756596
  inv_coeff:
    value: 1.0
  cov_coeff:
    value: 0.04 # 1/25  
  loss:
    value: "pseudo-huber"
  projector_dims:
    value: 256


# --- Static parameters can be defined here too ---
# --- These will be included in wandb.config for every run ---
  max_steps:
    value: 8001
  load_frac:
    value: 1.0 # Use 0.01 for quick test runs
  checkpoint_every:
    value: 400
  val_every:
    value: 200
  batch_size:
    value: 32
  data_dir:
    value: "/scratch/users/nshaheed/musdb18"

# command:
#   - ${env}
#   - uv          # <-- Split into its own item
#   - run         # <-- Split into its own item
#   - ${program}  # <-- The program name is the third item
#   - --data-dir
#   - /scratch/users/nshaheed/musdb18
