# sweep.yaml
program: train_sweep.py # The script to run
method: random
metric:
  name: val/loss
  goal: minimize
parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 1.0e-6
    max: 1.0e-2
  num_inner_layers:
    values: [2, 4, 6, 8, 16]
  hidden_dims_scale:
    values: [1, 2, 4, 8, 16]
  var_coeff:
    distribution: uniform
    min: 0.5
    max: 1.5
  inv_coeff:
    distribution: uniform
    min: 0.5
    max: 1.5
  cov_coeff:
    distribution: log_uniform_values
    min: 0.01 # 1/100
    max: 0.2  # 1/5

# --- Static parameters can be defined here too ---
# --- These will be included in wandb.config for every run ---
  max_steps:
    value: 2000
  load_frac:
    value: 1.0 # Use 0.01 for quick test runs
  checkpoint_every:
    value: 3000
  val_every:
    value: 200
  batch_size:
    value: 32    