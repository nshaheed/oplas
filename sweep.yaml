# sweep.yaml
program: train_sweep.py # The script to run
method: random
metric:
  name: val/recon_loss
  goal: minimize
parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 1.0e-6
    max: 1.0e-2
  num_inner_layers:
    value: 4
  hidden_dims_scale:
    value: 8
  var_coeff:
    value: 0.8525204745756596
  inv_coeff:
    value: 1.0
  cov_coeff:
    value: 0.04 # 1/25  
  loss:
    value: "pseudo-huber"
  projector_dims:
    values: [64, 128]


# --- Static parameters can be defined here too ---
# --- These will be included in wandb.config for every run ---
  max_steps:
    value: 8001
  load_frac:
    value: 1.0 # Use 0.01 for quick test runs
  checkpoint_every:
    value: 400
  val_every:
    value: 200
  batch_size:
    value: 32
  data_dir:
    value: "/scratch/users/nshaheed/musdb18"

# command:
#   - ${env}
#   - uv          # <-- Split into its own item
#   - run         # <-- Split into its own item
#   - ${program}  # <-- The program name is the third item
#   - --data-dir
