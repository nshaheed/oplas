# sweep.yaml
program: train_sweep.py # The script to run
method: random
metric:
  name: val/recon_loss
  goal: minimize
early_terminate:
  type: hyperband
  min_iter: 100
  eta: 2
parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 8.0e-2
  adams_beta1:
    distribution: log_uniform_values
    min: 0.85
    max: 0.95
  adams_epsilon:
    distribution: log_uniform_values
    min: 5.0e-9
    max: 8.0e-8
  kld_warmup:
    distribution: log_uniform_values
    min: 500
    max: 4000
  num_inner_layers:
    value: 1
  hidden_dims_scale:
    values: [4, 8, 16]
  var_coeff:
    distribution: log_uniform_values
    min: 0.5
    max: 1.0
  inv_coeff:
    value: 1.0
  cov_coeff:
    value: 0.04 # 1/25  
  loss:
    value: "pseudo-huber"
  projector_dims:
    value: 256
  scheduler:
    value: "none"
  augment:
    value: False
  arch:
    value: "none"

# --- Static parameters can be defined here too ---
# --- These will be included in wandb.config for every run ---
  max_steps:
    value: 10001
  load_frac:
    value: 1.0 # Use 0.01 for quick test runs
  checkpoint_every:
    value: 400
  num_stems: 
    value: 16
  val_every:
    value: 500
  batch_size:
    value: 1024
  data_dir:
    value: "/scratch/users/nshaheed/musdb18"

# command:
#   - ${env}
#   - uv          # <-- Split into its own item
#   - run         # <-- Split into its own item
#   - ${program}  # <-- The program name is the third item
#   - --data-dir
#   - /scratch/users/nshaheed/musdb18
