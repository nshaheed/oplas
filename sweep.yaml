# sweep.yaml
program: train_sweep.py # The script to run
method: bayes
metric:
  name: val/recon_loss
  goal: minimize
parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 3.2e-4
    max: 1.153e-3
  num_inner_layers:
    values: [4, 6]
  hidden_dims_scale:
    values: [4, 8, 12, 16]
  var_coeff:
    distribution: uniform
    min: 0.55
    max: 0.86
  inv_coeff:
    value: 1.0
  cov_coeff:
    value: 0.04 # 1/25  

# --- Static parameters can be defined here too ---
# --- These will be included in wandb.config for every run ---
  max_steps:
    value: 20000
  load_frac:
    value: 1.0 # Use 0.01 for quick test runs
  checkpoint_every:
    value: 400
  val_every:
    value: 200
  batch_size:
    value: 32
  data_dir:
    value: "/scratch/users/nshaheed/musdb18"

# command:
#   - ${env}
#   - uv          # <-- Split into its own item
#   - run         # <-- Split into its own item
#   - ${program}  # <-- The program name is the third item
#   - --data-dir
#   - /scratch/users/nshaheed/musdb18
